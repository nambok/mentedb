[package]
name = "mentedb-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "MenteDB server with REST API, WebSocket, auth, and observability"
readme = "../../README.md"
keywords = ["database", "server", "api", "ai", "agent"]
categories = ["database-implementations", "web-programming::http-server"]

[dependencies]
mentedb = { workspace = true, features = ["enrichment"] }
mentedb-core = { workspace = true }
mentedb-cognitive = { workspace = true }
mentedb-extraction = { workspace = true }
mentedb-embedding = { workspace = true }
tokio = { workspace = true }
tokio-stream = { version = "0.1", features = ["net"] }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
anyhow = { workspace = true }
bytes = { workspace = true }
axum = { version = "0.8", features = ["ws"] }
# Native HTTPS for the REST API (--tls-cert / --tls-key). rustls on the ring
# provider, the same crypto backend reqwest already uses, so no aws-lc build.
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace", "compression-gzip"] }
http-body-util = "0.1"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
tonic = { version = "0.13", features = ["tls-ring"] }
prost = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
prometheus = { version = "0.13", features = ["process"] }

[features]
default = []
# Bundle the local Candle embedding model (all-MiniLM-L6-v2) so the server has
# zero-config semantic search. Enabled in release/Docker builds.
local-embeddings = ["mentedb-embedding/local"]
# Native AWS Bedrock, signed with SigV4: Claude extraction
# (MENTEDB_LLM_PROVIDER=bedrock) and embeddings (--embedding-provider bedrock).
# Credentials come from static env keys or the ECS task role / EKS Pod
# Identity endpoint.
bedrock = ["mentedb-extraction/bedrock", "mentedb-embedding/bedrock"]

[build-dependencies]
tonic-build = "0.14"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
hyper = "1"
http-body-util = "0.1"
tempfile = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
mentedb-extraction = { workspace = true }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }

[package.metadata.docs.rs]
all-features = true
